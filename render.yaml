services:
  - type: web
    name: taiwan-stock-advisor-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ALLOW_ORIGINS
        sync: false
      - key: REQUIRE_USER_API_KEY
        value: "1"
